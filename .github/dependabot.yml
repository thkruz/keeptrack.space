# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

---
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    target-branch: 'develop'
    labels: ['Dependencies']
    commit-message:
      prefix: 'chore(deps): :wrench:'
      prefix-development: 'chore(deps-dev): :wrench:'
    cooldown:
      default-days: 3
      semver-major-days: 7
    ignore:
      # rspack 2.1.0 through 2.3.2 miscompile the production bundle and the app
      # never boots (2.3.x: `static x = new Self()` becomes a TDZ ReferenceError;
      # 2.1/2.2: "width is not defined"). Pinned at 2.0.8. Retest a newer
      # release with the Boot Smoke Test before removing this.
      - dependency-name: '@rspack/*'
        versions: ['>=2.1.0']
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    target-branch: 'develop'
    labels: ['Dependencies']
    commit-message:
      prefix: 'chore(deps): :wrench:'
    cooldown:
      default-days: 3
    groups:
      actions-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
